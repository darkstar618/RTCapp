<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>RTC Dashboard</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:sans-serif;background:#0f1117;color:#e2e8f0}.topbar{background:#1a1d27;border-bottom:1px solid #2d3148;padding:16px 32px;display:flex;align-items:center;justify-content:space-between}.topbar h1{color:#7c6af7;font-size:18px}#login-screen{max-width:400px;margin:80px auto;background:#1a1d27;border:1px solid #2d3148;border-radius:12px;padding:32px}#login-screen h2{margin-bottom:24px}.field{margin-bottom:16px}.field label{display:block;font-size:12px;color:#94a3b8;margin-bottom:6px;text-transform:uppercase}.field input{width:100%;background:#0f1117;border:1px solid #2d3148;border-radius:8px;padding:10px 14px;color:#e2e8f0;font-size:14px;outline:none}.btn{width:100%;background:#7c6af7;color:white;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px}#error-msg{color:#f87171;font-size:13px;margin-top:12px;display:none}#dashboard{display:none;padding:32px;max-width:1100px;margin:0 auto}.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px}.stat-card{background:#1a1d27;border:1px solid #2d3148;border-radius:12px;padding:24px}.stat-card .label{font-size:12px;color:#64748b;text-transform:uppercase;margin-bottom:8px}.stat-card .value{font-size:32px;font-weight:700;color:#7c6af7}.section{background:#1a1d27;border:1px solid #2d3148;border-radius:12px;padding:24px;margin-bottom:24px}.section h2{font-size:15px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}.refresh-btn{font-size:12px;background:#2d3148;border:none;color:#94a3b8;padding:4px 12px;border-radius:6px;cursor:pointer}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;padding:8px 12px;color:#64748b;border-bottom:1px solid #2d3148;font-size:11px;text-transform:uppercase}td{padding:10px 12px;border-bottom:1px solid #1e2235;color:#cbd5e1}.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}.badge.active{background:#14532d;color:#4ade80}.badge.closed{background:#1e1e2e;color:#475569}.empty{color:#475569;text-align:center;padding:24px}.logout-btn{background:none;border:1px solid #2d3148;color:#64748b;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px}</style></head><body><div class="topbar"><h1>RTC Platform</h1><div style="display:flex;align-items:center;gap:12px"><span id="app-id-display"></span><button class="logout-btn" onclick="logout()">Logout</button></div></div><div id="login-screen"><h2>Developer Login</h2><div class="field"><label>App ID</label><input id="inp-appid" placeholder="ap_..."></div><div class="field"><label>App Secret</label><input id="inp-secret" type="password" placeholder="sk_..."></div><button class="btn" onclick="login()">Sign In</button><div id="error-msg"></div></div><div id="dashboard"><div class="stats-grid"><div class="stat-card"><div class="label">Total Channels</div><div class="value" id="stat-total-ch">-</div></div><div class="stat-card"><div class="label">Active Channels</div><div class="value" id="stat-active-ch">-</div></div><div class="stat-card"><div class="label">Total Sessions</div><div class="value" id="stat-sessions">-</div></div><div class="stat-card"><div class="label">Minutes Used</div><div class="value" id="stat-minutes">-</div></div></div><div class="section"><h2>Channels <button class="refresh-btn" onclick="loadData()">Refresh</button></h2><table><thead><tr><th>Channel ID</th><th>Status</th><th>Active</th><th>Sessions</th><th>Created</th></tr></thead><tbody id="channels-table"><tr><td colspan="5" class="empty">Loading...</td></tr></tbody></table></div><div class="section"><h2>Recent Sessions <button class="refresh-btn" onclick="loadData()">Refresh</button></h2><table><thead><tr><th>Identity</th><th>Channel</th><th>Room</th><th>Joined</th><th>Duration</th></tr></thead><tbody id="sessions-table"><tr><td colspan="5" class="empty">Loading...</td></tr></tbody></table></div></div><script>let sdkToken=localStorage.getItem("sdk_token");function fmt(ts){return ts?new Date(ts).toLocaleString():"—"}function fmtD(ms){if(!ms)return"—";const s=Math.floor(ms/1000);return s<60?s+"s":Math.floor(s/60)+"m "+(s%60)+"s"}async function login(){const appId=document.getElementById("inp-appid").value.trim();const secret=document.getElementById("inp-secret").value.trim();const errEl=document.getElementById("error-msg");errEl.style.display="none";if(!appId||!secret){errEl.textContent="App ID and secret required";errEl.style.display="block";return;}try{const r=await fetch("http://localhost:3001/sdk/token",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({app_id:appId,app_secret:secret})});const data=await r.json();if(!r.ok)throw new Error(data.error||"Login failed");sdkToken=data.access_token;localStorage.setItem("sdk_token",sdkToken);document.getElementById("app-id-display").textContent=appId;showDashboard();}catch(e){errEl.textContent=e.message;errEl.style.display="block";}}async function loadData(){if(!sdkToken)return;const headers={Authorization:"Bearer "+sdkToken};try{const[sR,cR,seR]=await Promise.all([fetch("http://localhost:3002/v1/dashboard/stats",{headers}),fetch("http://localhost:3002/v1/dashboard/channels",{headers}),fetch("http://localhost:3002/v1/dashboard/sessions",{headers})]);if(sR.status===401){logout();return;}const stats=await sR.json();const channels=await cR.json();const sessions=await seR.json();document.getElementById("stat-total-ch").textContent=stats.total_channels;document.getElementById("stat-active-ch").textContent=stats.active_channels;document.getElementById("stat-sessions").textContent=stats.total_sessions;document.getElementById("stat-minutes").textContent=stats.total_minutes;const ctb=document.getElementById("channels-table");ctb.innerHTML=channels.length===0?"<tr><td colspan=5 class=empty>No channels yet</td></tr>":channels.map(c=>"<tr><td style=\"font-family:monospace;font-size:12px\">"+c.id+"</td><td><span class=\"badge "+(c.closed_at?"closed":"active")+"\">"+(c.closed_at?"closed":"active")+"</span></td><td>"+c.active_participants+"</td><td>"+c.total_sessions+"</td><td>"+fmt(c.created_at)+"</td></tr>").join("");const stb=document.getElementById("sessions-table");stb.innerHTML=sessions.length===0?"<tr><td colspan=5 class=empty>No sessions yet</td></tr>":sessions.map(s=>"<tr><td>"+s.identity+"</td><td style=\"font-family:monospace;font-size:11px\">"+s.channel_id+"</td><td>"+s.room+"</td><td>"+fmt(s.joined_at)+"</td><td>"+fmtD(s.duration_ms)+"</td></tr>").join("");}catch(e){console.error(e);}}function showDashboard(){document.getElementById("login-screen").style.display="none";document.getElementById("dashboard").style.display="block";loadData();setInterval(loadData,15000);}function logout(){localStorage.removeItem("sdk_token");sdkToken=null;document.getElementById("login-screen").style.display="block";document.getElementById("dashboard").style.display="none";}if(sdkToken)showDashboard();</script></body></html>
